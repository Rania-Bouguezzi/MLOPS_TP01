
[project]
name = "telco-churn"
version = "0.1.0"
description = "Telco Customer Churn - MLOps TP02"
readme = "README.md"
authors = [
    { name = "Rania", email = "bouguezzirania@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
]

[project.scripts]
telco-churn = "telco_churn:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
